body{background:var(--plum);background-image:radial-gradient(var(--plum2) 2px,transparent 2.5px);background-size:28px 28px;font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;font-weight:500;color:var(--cream)}
.wrap{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding:max(10px,env(safe-area-inset-top,0px)) 12px max(10px,env(safe-area-inset-bottom,0px));max-width:1200px;margin:0 auto}
.tile{background:var(--rust);border-radius:20px;border:3px solid var(--deep);box-shadow:0 4px 0 var(--deep);padding:8px 16px}
.title{display:flex;gap:16px;align-items:center;background:#a8481f}
#logo{height:clamp(34px,7vh,56px);width:auto;background:none;border:0;padding:0;margin:0 4px;transform:rotate(-2deg);transition:transform .2s;filter:drop-shadow(2px 0 0 #fff8ec) drop-shadow(-2px 0 0 #fff8ec) drop-shadow(0 2px 0 #fff8ec) drop-shadow(0 -2px 0 #fff8ec) drop-shadow(0 4px 0 var(--deep))}#logo:hover{transform:rotate(2deg) scale(1.05)}
h1{margin:0;font:normal clamp(30px,5.5vh,48px)/1 "Creepster","Baloo 2",cursive;letter-spacing:2px;color:#ffb347;text-shadow:2px 2px var(--deep);animation:flick 3.5s infinite}
.sub{font-size:clamp(12px,1.9vh,16px);font-weight:700;line-height:1.2;display:block}
.hint{flex:1;font-size:clamp(12px,2vh,15px);line-height:1.3;text-align:right;color:#ffe9cf}
@media(max-width:760px){.hint{display:none}}
.map{position:relative;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:24px;border:4px solid var(--deep);box-shadow:0 4px 0 var(--deep);background-color:#1d3a8a;background-image:radial-gradient(circle at 50% 100%,transparent 9px,#2c56b8 9px 12px,transparent 12px),radial-gradient(circle at 0 0,transparent 9px,#2c56b8 9px 12px,transparent 12px);background-size:40px 30px;animation:sea 14s linear infinite}
@keyframes sea{to{background-position:40px 0,40px 0}}
.stage{position:relative;width:min(100cqw,125cqh);height:min(100cqh,80cqw)}
.stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.pin{position:absolute;transform:translate(-50%,-100%);width:8.4%;min-width:34px;padding:0;border:0;background:none;cursor:pointer;font:inherit;color:inherit;z-index:3}
.pin svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35));transition:transform .15s;animation:drop .7s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:calc(var(--i)*.18s)}
.pin:hover svg,.pin:focus-visible svg,.pin.on svg{transform:translateY(-6px) scale(1.1);animation:none}
.pin:focus-visible{outline:3px solid #fff;outline-offset:4px;border-radius:12px}
.pin .lbl{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:5px;white-space:nowrap;background:var(--cream);color:var(--deep);border:2px solid var(--deep);border-radius:999px;padding:0 9px;font-size:clamp(11px,1.7vw,16px);font-weight:800;line-height:1.35}
.pin.on .lbl{background:#ffd23f}
.pin .body{fill:#c4161c}.pin .ring{fill:#140808}.pin .face{fill:#fff}.pin .eye{fill:#140808}
.pin.lock .body{fill:#6c5a82}.pin.lock .face{fill:#d9cdea}
.pin.open svg{animation:drop .7s cubic-bezier(.3,1.6,.5,1) backwards,bob 2.4s ease-in-out .9s infinite,glowr 2.4s ease-in-out .9s infinite;animation-delay:calc(var(--i)*.18s),calc(var(--i)*.18s + .9s),calc(var(--i)*.18s + .9s)}
.pin.open.on svg,.pin.open:hover svg{animation:glowr 2.4s ease-in-out infinite}
.pin.open:before{content:"";position:absolute;left:50%;top:100%;width:80%;aspect-ratio:3/1;border:3px solid #ffd23f;border-radius:50%;transform:translate(-50%,-50%) scale(.3);opacity:0;animation:rip 2s ease-out infinite}
.pin.lock .body{filter:saturate(.6)}
@keyframes drop{from{transform:translateY(-120px) scale(.6);opacity:0}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes glowr{50%{filter:drop-shadow(0 0 12px #ffb347) drop-shadow(0 0 4px #ff7a1a)}}
@keyframes rip{0%{transform:translate(-50%,-50%) scale(.3);opacity:.9}100%{transform:translate(-50%,-50%) scale(1.8);opacity:0}}
@keyframes flick{0%,100%{opacity:1}45%{opacity:.85}50%{opacity:.5}55%{opacity:.95}}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.fly{position:absolute;left:-8%;width:5%;animation:fly linear infinite}
.fly svg{width:100%;display:block;animation:flap .22s ease-in-out infinite alternate}
@keyframes fly{0%{transform:translate(0,0)}25%{transform:translate(310%,-60%)}50%{transform:translate(640%,20%)}75%{transform:translate(1000%,-50%)}100%{transform:translate(1400%,10%)}}
@keyframes flap{to{transform:scaleY(.45)}}
.ember{position:absolute;bottom:-3%;width:6px;height:6px;border-radius:50%;background:#ffb347;box-shadow:0 0 8px 2px #ff7a1a;animation:rise linear infinite;opacity:0}
@keyframes rise{10%{opacity:.9}100%{transform:translate(var(--dx),-110cqh);opacity:0}}
.fog{position:absolute;left:-50%;bottom:0;width:200%;height:22%;background:radial-gradient(ellipse at 20% 100%,rgba(255,255,255,.16),transparent 60%),radial-gradient(ellipse at 60% 100%,rgba(220,200,255,.14),transparent 60%),radial-gradient(ellipse at 90% 100%,rgba(255,255,255,.12),transparent 55%);animation:fog 26s ease-in-out infinite alternate}
@keyframes fog{to{transform:translateX(30%)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;animation:flash 11s infinite}
@keyframes flash{0%,93%,95.5%,100%{opacity:0}94%{opacity:.35}95%{opacity:.1}}
.drift{animation:drift 9s ease-in-out infinite alternate}
.drift.b{animation-duration:13s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translateX(60px)}}
.march{animation:march 1.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-26}}
.win{animation:flick 2.6s infinite}.win.b{animation-delay:1.1s}
.glowp{animation:pg 2.4s ease-in-out infinite}
@keyframes pg{50%{filter:drop-shadow(0 0 14px #ffb347)}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.2s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.2);opacity:.2}50%{transform:scale(1);opacity:1}}
.serp{animation:serp 3s ease-in-out infinite alternate}
@keyframes serp{to{transform:translateY(-10px)}}
.moon{transform-box:fill-box;transform-origin:center;animation:moon 4s ease-in-out infinite}
@keyframes moon{50%{transform:scale(1.12);filter:drop-shadow(0 0 12px #ffe27a)}}
.detail{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:#e8a07a;color:var(--deep);padding:8px 16px;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}}
.ico{width:clamp(44px,8vh,64px);aspect-ratio:1;border-radius:18px;background:var(--rust);border:3px solid var(--deep);display:flex;align-items:center;justify-content:center}
.ico svg{width:68%;height:auto}
.detail.lock .ico{background:#8a7d99}
.wk{font-size:clamp(12px,1.9vh,16px);font-weight:700;color:#7a3200;line-height:1.1}
.detail h3{margin:0;font-size:clamp(18px,3.2vh,26px);line-height:1.1;font-weight:800;color:#5a1f00}
.detail p{margin:2px 0 0;font-size:clamp(12px,2vh,15px);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btn{display:inline-block;text-align:center;text-decoration:none;font:800 clamp(15px,2.6vh,19px)/1.1 "Baloo 2",sans-serif;padding:9px 16px;color:#fff;background:var(--orange);border:3px solid var(--deep);border-radius:14px;box-shadow:0 3px 0 var(--deep)}
.btn:hover{background:#ff8a2a}
.btn[aria-disabled=true]{background:#8a7d99;cursor:not-allowed}
@media(max-width:520px){.detail{grid-template-columns:auto 1fr;gap:8px 12px}.detail .btn{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}

const tag=k=>k.tag||'Week '+k.w;
const pins=document.getElementById('pins'),det=document.getElementById('detail');
function show(k){
 const open=!!k.url;
 document.querySelectorAll('.pin').forEach(p=>{const on=+p.dataset.w===k.w;p.classList.toggle('on',on);p.setAttribute('aria-pressed',on)});
 det.className='tile detail '+(open?'open':'lock');det.replaceChildren();
 const ico=document.createElement('div');ico.className='ico';ico.innerHTML='<svg viewBox="0 0 60 52" aria-hidden="true"><use href="#pump"/></svg>';
 const txt=document.createElement('div');
 const wk=document.createElement('div');wk.className='wk';wk.textContent=tag(k)+' · '+k.date;
 const t=document.createElement('h3');t.textContent=open?k.title:'Sắp ra mắt';
 const d=document.createElement('p');d.textContent=open?k.desc:'Điểm dừng này vẫn đang được phù phép. Hãy quay lại sau nhé!';
 txt.append(wk,t,d);
 let b;
 if(open){b=document.createElement('a');b.href=k.url;b.target='_blank';b.rel='noopener';b.textContent=k.btn||'Bắt đầu hành trình'}
 else{b=document.createElement('span');b.setAttribute('aria-disabled','true');b.textContent='Đang khoá'}
 b.className='btn';det.append(ico,txt,b)}
WEEKS.forEach(k=>{
 const open=!!k.url,p=document.createElement('button');
 p.type='button';p.className='pin '+(open?'open':'lock');p.dataset.w=k.w;
 p.style.setProperty('--i',WEEKS.indexOf(k));p.style.left=k.x+'%';p.style.top=k.y+'%';
 p.setAttribute('aria-label',tag(k)+(open?'':' (sắp ra mắt)'));
 p.innerHTML=PIN+'<span class="lbl">'+tag(k)+'</span>';
 p.addEventListener('click',()=>show(k));pins.appendChild(p)});
show(WEEKS[0]);

for(let i=0;i<3;i++){const f=document.createElement('div');f.className='fly';f.style.top=(8+i*14)+'%';f.style.animationDuration=(14+i*5)+'s';f.style.animationDelay=(-i*6)+'s';f.innerHTML='<svg viewBox="0 0 30 16"><use href="#bat"/></svg>';fx.appendChild(f)}
for(let i=0;i<16;i++){const e=document.createElement('i');e.className='ember';e.style.left=(5+Math.random()*90)+'%';e.style.setProperty('--dx',(Math.random()*80-40)+'px');e.style.animationDuration=(6+Math.random()*6)+'s';e.style.animationDelay=(-Math.random()*10)+'s';fx.appendChild(e)}
